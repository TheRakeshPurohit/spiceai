les</text><text x="360.5" y="557" fill="#6366f1" font-size="11" font-style="italic" text-anchor="middle">seq 2,001–10,000</text><rect width="205" height="82" x="150" y="604" fill="#fff" stroke="#312e81" stroke-width="2" rx="8"/><text x="252.5" y="625" fill="#1e293b" font-size="15" font-weight="700" text-anchor="middle">Cold object-store tier</text><text x="252.5" y="642" fill="#475569" font-size="11.5" text-anchor="middle">Hilbert-clustered Vortex,</text><text x="252.5" y="657" fill="#475569" font-size="11.5" text-anchor="middle">read-optimized (optional)</text><text x="252.5" y="679" fill="#6366f1" font-size="11" font-style="italic" text-anchor="middle">seq ≤ 2,000</text><path fill="none" stroke="#1e293b" stroke-width="2" marker-end="url(#ah)" d="M1000,136 C1000,144.0 975,144.0 975,152"/><rect width="84.8" height="45" x="1029.6" y="149.5" fill="#fff" stroke="#6366f1" stroke-width="1" opacity=".97" rx="5"/><text x="1072" y="160.5" fill="#334155" font-size="10" text-anchor="middle">CDC connector</text><text x="1072" y="173.5" fill="#334155" font-size="10" text-anchor="middle">emits ordered</text><text x="1072" y="186.5" fill="#334155" font-size="10" text-anchor="middle">changes</text><path fill="none" stroke="#1e293b" stroke-width="2" marker-end="url(#ah)" d="M838,222 C838,242.0 812,242.0 812,262"/><rect width="174.4" height="45" x="602.8" y="222.5" fill="#fff" stroke="#6366f1" stroke-width="1" opacity=".97" rx="5"/><text x="690" y="233.5" fill="#334155" font-size="10" text-anchor="middle">apply loop: coalesce a burst;</text><text x="690" y="246.5" fill="#334155" font-size="10" text-anchor="middle">small burst → inline /</text><text x="690" y="259.5" fill="#334155" font-size="10" text-anchor="middle">mem-tier</text><path fill="none" stroke="#1e293b" stroke-width="2" marker-end="url(#ah)" d="M665,332 C665,353.0 640,353.0 640,374"/><rect width="168.8" height="45" x="420.6" y="327.5" fill="#fff" stroke="#6366f1" stroke-width="1" opacity=".97" rx="5"/><text x="505" y="33